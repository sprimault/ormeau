services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ormeau
      POSTGRES_DB: gescom
    ports:
      - "35432:5432"
    volumes:
      - ./ddl/postgres.sql:/docker-entrypoint-initdb.d/10-gescom.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gescom"]
      interval: 2s
      timeout: 3s
      retries: 30
