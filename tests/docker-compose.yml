services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ormeau
      POSTGRES_DB: gescom
    ports:
      - "35432:5432"
    volumes:
      - ./ddl/postgres.sql:/docker-entrypoint-initdb.d/10-gescom.sql:ro
      - ./ddl/20-empreinte.sh:/docker-entrypoint-initdb.d/20-empreinte.sh:ro
      - ./ddl/30-allerretour.sql:/docker-entrypoint-initdb.d/30-allerretour.sql:ro
    healthcheck:
      # Par TCP : pendant l'initialisation, l'image fait tourner un serveur
      # temporaire joignable seulement par le socket Unix. Sans -h, le conteneur
      # se dirait prêt avant la fin de tests/ddl/, empreinte comprise.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gescom"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqlserver:
    # Épinglée sur une mise à jour cumulative : la version du serveur entre
    # dans le calque de référence, et 2022-latest la ferait changer seule.
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ormeau!2026"
      MSSQL_PID: Developer
    ports:
      - "31433:1433"
    volumes:
      - ./ddl/sqlserver.sql:/ddl/sqlserver.sql:ro
      - ./ddl/sqlserver-init.sh:/ddl/sqlserver-init.sh:ro
    healthcheck:
      # L'image n'a pas de répertoire d'initialisation : le contrôle de santé
      # charge le DDL et pose son empreinte, voir sqlserver-init.sh.
      test: ["CMD-SHELL", "sh /ddl/sqlserver-init.sh"]
      interval: 5s
      timeout: 30s
      retries: 40
      start_period: 20s
