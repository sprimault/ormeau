# Publication d'une version, déclenchée par un tag.
#
# Une seule machine produit les cinq cibles : Go croise nativement, et c'est
# vrai tant qu'aucun pilote n'exige cgo. Jamais le poste de travail, qui n'offre
# aucune garantie de reproductibilité.
#
# La release est créée en brouillon : les notes disent ce que le numéro ne dit
# pas — un changement de version_ri, ce qu'un intégrateur doit reprendre — et ça
# demande un jugement qu'aucun générateur ne remplace. Relire, compléter,
# publier.
#
# Actions épinglées au SHA, pour la même raison que dans ci.yml : un tag de
# majeure est mobile, et celles-ci s'exécutent avec les droits d'écriture du
# dépôt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # La même que ci.yml : le front publié doit être celui que la CI a validé.
  NODE_VERSION: '22'

jobs:
  # Le miroir du paquet PHP reçoit le tag avant toute autre étape, et rien ne
  # part sans lui : ni binaires, ni brouillon, ni image. Sans cet ordre, un
  # composer require de la nouvelle version échouerait pendant que la release
  # l'annonce déjà.
  miroir:
    name: Miroir du paquet PHP
    uses: ./.github/workflows/miroir.yml

  binaires:
    name: Binaires
    runs-on: ubuntu-latest
    needs: miroir
    permissions:
      contents: write
      # L'attestation lie l'archive au commit et au workflow qui l'a produite,
      # et se vérifie avec `gh attestation verify`. C'est le seul contrepoids
      # crédible à des binaires non signés, sur un outil qui réclame un mot de
      # passe de base de données.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le titre et les notes viennent de la section du CHANGELOG qui porte
      # cette version. Elle s'écrit avec les lots et se relit en PR, au moment
      # où elle compte : rien n'est à recopier ici, où personne ne la relirait.
      #
      # Lue avant les tests et la construction : une section absente arrête la
      # publication, et autant le savoir avant de compiler cinq cibles. Une
      # version sans notes ne dit ni ce qui change, ni ce qu'un calque ou un
      # fichier de décisions existant doit reprendre.
      - name: Lire les notes dans le CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          # index et non une expression régulière : les crochets du titre de
          # section formeraient une classe de caractères, et « [0.4.0] » ne
          # désignerait plus qu'un seul caractère.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dedans = 1; next }
            dedans && index($0, "## ") == 1 { exit }
            dedans { print }
          ' CHANGELOG.md > notes.md

          # Une section faite de lignes vides passerait un test de taille : c'est
          # du texte qui est exigé, pas des octets.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md n'a pas de section pour la version $version" >&2
            exit 1
          fi

          # Le titre est la troisième partie du titre de section, après la
          # version et la date. Absent, la release se nomme par son tag seul.
          titre=$(grep -m1 -F "## [$version]" CHANGELOG.md \
            | sed -n 's/^## \[[^]]*\][^—]*—[^—]*— *//p')
          echo "titre=${GITHUB_REF_NAME}${titre:+ — $titre}" >> "$GITHUB_OUTPUT"
          cat notes.md

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Le binaire embarque le front : make test et make binaries le
      # construisent, et go:embed échoue sans lui. npm ci et jamais npm
      # install, pour publier ce que le lock a validé.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      # ci.yml n'écoute que les branches et les PR : sans ce garde-fou, un tag
      # posé sur un commit rouge publierait quand même.
      - name: Tests
        run: make test
        env:
          CGO_ENABLED: '1'

      # La même cible qu'en local : deux définitions de la matrice de
      # compilation finiraient par diverger, et c'est celle du workflow qu'on
      # ne peut pas essayer avant de poser le tag.
      - name: Construire les cinq cibles
        run: make binaries VERSION=${{ github.ref_name }}

      - name: Vérifier la version injectée
        run: |
          obtenue=$(./dist/ormeau_linux_amd64 version)
          attendue="ormeau ${{ github.ref_name }}"
          if [ "$obtenue" != "$attendue" ]; then
            echo "version « $obtenue », attendue « $attendue »"
            exit 1
          fi
          echo "$obtenue"

      # Zip sous Windows, tar.gz ailleurs : c'est ce que chaque système sait
      # ouvrir sans rien installer, et le tar préserve le bit exécutable qu'un
      # binaire téléchargé nu perdrait.
      #
      # LICENSE et NOTICE vont dans l'archive et non à côté : Apache 2.0 les
      # exige à la redistribution, et personne ne télécharge un asset séparé
      # pour accompagner un binaire.
      #
      # Le nom de l'archive porte version, système et architecture : c'est ce
      # qui permet de choisir son fichier, et de garder deux versions dans le
      # même répertoire sans les confondre. Le binaire qu'elle contient
      # s'appelle « ormeau » tout court : une fois extrait, on sait sur quelle
      # machine on est, et personne ne veut taper ./ormeau_linux_amd64.
      - name: Empaqueter
        run: |
          mkdir -p publication
          version="${{ github.ref_name }}"

          for binaire in dist/ormeau_*; do
            nom=$(basename "$binaire")
            case "$nom" in
              *.exe) cible="${nom%.exe}" ; executable="ormeau.exe" ;;
              *)     cible="$nom"        ; executable="ormeau" ;;
            esac
            # ormeau_linux_amd64 -> ormeau_v0.2.0_linux_amd64
            paquet="ormeau_${version}_${cible#ormeau_}"

            dossier="paquets/${paquet}"
            mkdir -p "$dossier"
            cp "$binaire" "$dossier/$executable"
            cp LICENSE NOTICE "$dossier/"

            case "$nom" in
              *.exe) (cd paquets && zip -qr "../publication/${paquet}.zip" "$paquet") ;;
              *)     tar -czf "publication/${paquet}.tar.gz" -C paquets "$paquet" ;;
            esac
          done
          cd publication
          # Sur les archives et non sur les binaires : c'est l'archive que la
          # personne télécharge, donc ce qu'elle peut vérifier.
          sha256sum ormeau_* > SHA256SUMS
          ls -la

      - name: Attester la provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'publication/ormeau_*'

      # gh est préinstallé sur le runner : pas d'action tierce à épingler pour
      # une opération que la ligne de commande fait aussi bien.
      - name: Créer la release en brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ steps.notes.outputs.titre }}" \
            --notes-file notes.md \
            publication/*

  image:
    name: Image multi-arch
    runs-on: ubuntu-latest
    needs: binaires
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      # Les binaires sont reconstruits ici plutôt que transportés depuis le job
      # précédent : un artefact d'échange coûte plus cher que deux minutes de
      # compilation, et le Dockerfile attend dist/ en place.
      - name: Construire les binaires
        run: make binaries VERSION=${{ github.ref_name }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Se connecter au registre
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les binaires étant déjà croisés, buildx n'a pas besoin d'émulation QEMU :
      # chaque plateforme reçoit l'artefact correspondant à TARGETOS/TARGETARCH.
      #
      # Pas de :latest tant qu'on est en 0.x. La clause du zéro dit que rien
      # n'est imposé sur ces versions : un docker pull sans étiquette
      # rapporterait une préversion sans que personne l'ait demandé. À poser
      # quand la 1.0.0 sortira.
      - name: Construire et publier
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
