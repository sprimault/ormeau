# Intégration continue.
#
# Les actions sont épinglées au SHA, le tag lisible en commentaire. Un tag de
# majeure comme `@v7` est mobile : il désigne un contenu qui change sans que ce
# dépôt bouge, donc du code tiers exécuté avec nos droits. Le SHA ne se réécrit
# pas. Contrepartie assumée : relever les versions est une opération manuelle.
#
# Pas d'image : la publication a son propre workflow.
#
# Le front, lui, est construit partout où du Go se compile : internal/interface
# l'embarque par go:embed, qui échoue quand le bundle manque. C'est le
# comportement voulu — un embarqué vide passerait la compilation et donnerait un
# binaire à interface blanche.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # L'audit doit tourner même quand personne ne contribue : une faille publiée
  # en amont n'attend pas la prochaine PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Doit rester égale à TYGO_VERSION dans le Makefile : le contrôle de dérive
  # compare une génération locale à une génération CI, et deux versions
  # différentes le feraient échouer sans qu'aucun type Go n'ait bougé.
  TYGO_VERSION: 'v0.2.21'

jobs:
  go:
    name: Go — lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # npm ci et jamais npm install : c'est le lock que la CI et les
      # contributeurs doivent voir. Sans lui, npx irait chercher la dernière
      # version de chaque outil, et un tsconfig valide ici deviendrait invalide
      # là-bas sans qu'une ligne ait bougé.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances du front
        run: npm ci
        working-directory: web

      # Version épinglée, la même que le Makefile : un lint qui change de règles
      # tout seul transforme une PR verte en PR rouge sans que rien n'ait bougé
      # côté code. Pas en deçà de v2.13.0, qui est la première à embarquer un
      # staticcheck capable d'analyser la stdlib Go 1.27.
      - name: Installer golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0

      # make lint régénère les types TypeScript et refuse toute dérive : sans
      # tygo, le contrôle ne tourne pas et les deux moitiés du projet peuvent
      # diverger sans que personne ne le voie.
      - name: Installer tygo
        run: go install github.com/gzuidhof/tygo@${{ env.TYGO_VERSION }}

      - name: Lint
        run: make lint

      # -race exige cgo, activé explicitement : les runners l'ont, mais
      # CGO_ENABLED peut valoir 0 selon le contexte. Sans rapport avec le
      # CGO_ENABLED=0 des binaires publiés.
      - name: Tests
        run: make test
        env:
          CGO_ENABLED: '1'

      # Le calque est un contrat public : un schéma invalide passerait inaperçu
      # jusqu'au premier intégrateur.
      #
      # Les deux contrôles suivants sont ceux qui comptent vraiment : ils
      # valident les calques de référence, que les tests Go figent sur la sortie
      # des structures, contre les schémas publiés. C'est ce qui empêche les deux
      # de diverger — un champ ajouté d'un côté seulement, ou une valeur hors
      # vocabulaire fermé, se voit ici, et non chez celui qui écrit un
      # générateur. Les deux niveaux, et chaque cas d'inférence : le motif doit
      # descendre dans les sous-répertoires, sans quoi il n'en couvre aucun.
      - name: Valider les JSON Schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --check-metaschema schemas/*.json
          check-jsonschema --schemafile schemas/calque-physique.v1.json \
            tests/reference/*.calque.json tests/reference/inference/*/physique.json
          check-jsonschema --schemafile schemas/calque-logique.v1.json \
            tests/reference/inference/*/logique.json

  # Job distinct des tests : une CVE publiée en amont n'a rien à voir avec la PR
  # en cours, et son échec ne doit pas se lire comme « ta contribution est
  # cassée ». Le déclencheur planifié le fait tourner même sans contribution.
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck ne signale une CVE que si le code appelle effectivement la
      # fonction affectée : beaucoup moins bruyant qu'un scan brut.
      - name: Installer govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnérabilités
        run: govulncheck ./...

  securite:
    name: Analyse statique de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # gosec compile ce qu'il analyse : sans le bundle, internal/interface ne
      # compile pas et l'analyse se réduit au silence.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construire le front
        run: npm ci && npm run build
        working-directory: web

      # Deux familles comptent ici plus que les autres : les identifiants en dur
      # et la construction de requêtes SQL. Les requêtes de catalogue sont des
      # constantes, aucune ne doit être assemblée à partir d'une entrée.
      - name: Installer gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec
        run: gosec ./...

  web:
    name: Front — lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: web

      # tsc avant eslint : vite build transpile sans contrôler les types, un
      # projet peut donc se construire en étant faux.
      - name: Types
        run: npx tsc -b
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      # Feature-Sliced Design n'est pas une intention : un import qui contourne
      # une API publique se corrige, il ne se met pas en liste d'exception.
      - name: Découpage FSD
        run: npx steiger ./src
        working-directory: web

      # Le front finit dans le binaire : une dépendance vulnérable y voyage
      # avec lui, sur le poste de quelqu'un qui manipule des identifiants de
      # base de données.
      - name: Vulnérabilités des dépendances
        run: npm run audit:high
        working-directory: web

      - name: Tests
        run: npm run test:run
        working-directory: web

  # Validation complète depuis composer.lock, qui résout PHP 8.4, Symfony 8 et
  # ORM 3 : c'est aussi le haut de la plage promise.
  php:
    name: PHP — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # php/ devient la racine du miroir, et Apache 2.0 exige LICENSE et NOTICE
      # avec toute distribution : les copies doivent suivre les originaux.
      # CHANGELOG.md y est pour Dependabot et Renovate, qui cherchent les notes
      # à la racine du dépôt source déclaré sur Packagist ; il s'arrête à la
      # 0.5.0, première version du miroir. L'écrire au split rendrait celui-ci
      # non déterministe, et le miroir n'avancerait plus en avance rapide.
      - name: Fichiers recopiés dans le paquet
        run: |
          for fichier in LICENSE NOTICE; do
            if ! cmp -s "../$fichier" "$fichier"; then
              echo "::error file=php/$fichier::php/$fichier diffère de $fichier à la racine. Copier le fichier de la racine : cp $fichier php/$fichier"
              exit 1
            fi
          done
          make -C .. -s php-changelog
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "::error file=php/CHANGELOG.md::php/CHANGELOG.md ne suit pas CHANGELOG.md. Le régénérer : make php-changelog"
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress

      - name: Tests
        run: composer test

      - name: Analyse statique
        run: composer analyse

      - name: Style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # Les entités attendues sont exclues du style du paquet, mais le code
      # produit doit se lire comme du code écrit à la main : il suit PER-CS,
      # comme on l'attend d'un développeur.
      - name: Style du code produit
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --rules=@PER-CS2.0 --using-cache=no tests/Generation/attendus

      # Ce que l'outil réécrit à chaque passage ne doit rien donner à corriger
      # aux règles @Symfony, les plus répandues dans les projets visés : sinon
      # chaque régénération y produit un diff sur des fichiers que personne n'a
      # touchés. Les classes de l'utilisateur, écrites une fois, n'en sont pas.
      - name: Code produit sous @Symfony
        run: composer style-produit-symfony

      - name: Vulnérabilités des dépendances
        run: composer audit

  # Les seuls jobs dispensés du lock, et la liste est fermée : elle se tient
  # alignée sur la règle de livraison. Chacun fixe Symfony et ORM, résout le
  # reste pour sa version de PHP, et ne lance que les tests — l'analyse et le
  # style ne dépendent pas des versions installées.
  #
  # Le bas de la plage est ORM 2.14 exactement : les versions antérieures
  # refusent une classe de base mappée placée sous une entité. Une promesse de
  # plancher qui n'est testée qu'au-dessus n'en est pas une.
  #
  # Symfony se fixe par SYMFONY_REQUIRE, que lit Flex, et non en exigeant
  # framework-bundle : celui de la 5.4 accepte http-kernel 6.4, et Composer
  # résout alors une application qui n'existe nulle part — un bundle qui
  # dépend d'AbstractBundle, absent de la 5.4, y passait.
  php-compat:
    name: PHP — ${{ matrix.nom }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: compat-php81-symfony54-orm2
            php: '8.1'
            symfony: '5.4.*'
            orm: '~2.14.0'
          - nom: compat-php82-symfony64-orm2
            php: '8.2'
            symfony: '6.4.*'
            orm: '^2.14'
          - nom: compat-php83-symfony74-orm3
            php: '8.3'
            symfony: '7.4.*'
            orm: '^3.0'
    defaults:
      run:
        working-directory: php
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          coverage: none

      - name: Résoudre la combinaison
        run: |
          composer require --no-update --no-interaction "doctrine/orm:${{ matrix.orm }}"
          composer update --no-interaction --no-progress --with-all-dependencies

      - name: Tests
        run: composer test
