#
# Génération des types TypeScript depuis les structures Go, par `make web-types`.
#
# Sur ce projet, ces types ne sont pas un confort : le calque est un contrat
# public versionné, et un front qui lit un champ que le Go n'expose plus produit
# un écran silencieusement faux. `make lint` régénère et refuse toute dérive.
packages:
  - path: "github.com/sprimault/ormeau/internal/calque"
    output_path: "web/src/shared/model/calque.ts"
    # validation.go pour Anomalie, que le résultat d'une extraction rend au front.
    include_files: ["physique.go", "logique.go", "validation.go"]
    frontmatter: |
      // Copyright 2026 Stéphane Primault <sprimault@users.noreply.github.com>
      // SPDX-License-Identifier: Apache-2.0
      //
      // Types générés depuis internal/calque par `make web-types` (tygo).
      // Ne pas modifier à la main.

  - path: "github.com/sprimault/ormeau/internal/introspection"
    output_path: "web/src/shared/model/introspection.ts"
    include_files: ["sommaire.go"]
    frontmatter: |
      // Copyright 2026 Stéphane Primault <sprimault@users.noreply.github.com>
      // SPDX-License-Identifier: Apache-2.0
      //
      // Types générés depuis internal/introspection par `make web-types` (tygo).
      // Ne pas modifier à la main.

  - path: "github.com/sprimault/ormeau/internal/interface"
    output_path: "web/src/shared/model/api.ts"
    include_files: ["api.go"]
    # TableSommaire vit dans introspection et l'API la rend telle quelle : la
    # réécrire ici en donnerait deux définitions, qui divergeraient au premier
    # champ ajouté d'un seul côté.
    type_mappings:
      "introspection.TableSommaire": "TableSommaire"
      "introspection.Portee": "Portee"
      "introspection.Avancement": "Avancement"
      "calque.Anomalie": "Anomalie"
    frontmatter: |
      // Copyright 2026 Stéphane Primault <sprimault@users.noreply.github.com>
      // SPDX-License-Identifier: Apache-2.0
      //
      // Types générés depuis internal/interface par `make web-types` (tygo).
      // Ne pas modifier à la main.

      import type { Anomalie } from './calque';
      import type { Avancement, Portee, TableSommaire } from './introspection';
